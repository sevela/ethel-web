# ETH-270 — CI branka pro ethel-web. Tenhle soubor vlastni ETH-270 dávka; ostatní
# dávky (ETH-260, ETH-272, ...) do něj nesahají bez konzultace.
#
# Web je hlavně statický obsah (landing + docs) — CI pokrývá jen 'scripts/**/*.js'
# (build skripty), to je jediný "kód" v repu. Viz CLAUDE.md.
name: CI

on:
  push:
  pull_request:
  schedule:
    # Tydenni dependency audit. Z nemergnute vetve se nespusti — az po mergi
    # do main (fáze 3 ETH-270, otevřený bod pro Jakuba).
    # Mimo kulatou minutu (ETH-309/294 batch): ETH-309 potvrdilo zpozdeni
    # 3h24m-4h01m proti planu, konzistentne napric repy — fronta GitHubu na
    # kulate minute (0 6 * * 1), ne problem konfigurace.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    name: "JS — npm run build:docs"
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build:docs

  lint:
    name: "JS — eslint"
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  format:
    name: "JS — prettier --check"
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: prettier --check (neblokující — 1 předexistující soubor, viz CLAUDE.md)
        continue-on-error: true
        run: |
          {
            echo "### prettier --check — předexistující nálezy (neblokující, ETH-260 je opraví)"
            echo '```'
            npm run format:check || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  no-tests:
    name: "JS — testy (žádný framework)"
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Ověř, že tvrzení "žádné testy" pořád platí (ETH-311)
        run: |
          set -e
          TEST_FILES=$(git ls-files | grep -E '\.(test|spec)\.[cm]?js$' || true)
          if [ -n "$TEST_FILES" ]; then
            echo "::error::V repu přibyly testovací soubory, ale tenhle job je pořád jen placeholder:"
            echo "$TEST_FILES"
            # ETH-311: `node --test tests/` (adresář jako pozicní argument) padá na
            # Node 22 s MODULE_NOT_FOUND. Bez pozicního argumentu jede defaultní
            # rekurzivní discovery, která `tests/` najde sama a ten bug nemá.
            echo "::error::Nahraď no-tests job reálným krokem, který je spustí (vzor: ethel-app, node --test)."
            exit 1
          fi
          HAS_TEST_SCRIPT=$(node -pe "!!(require('./package.json').scripts && require('./package.json').scripts.test)")
          if [ "$HAS_TEST_SCRIPT" = "true" ]; then
            echo "::error::V package.json přibyl 'test' skript, ale tenhle job je pořád jen placeholder — nahraď ho reálným krokem, který ho spustí."
            exit 1
          fi
          echo "::notice::Statický web pořád nemá testovací soubory (*.test.js/*.spec.js) ani 'test' skript — placeholder platí. Job spadne sám, jakmile to přestane být pravda."

  quality-baseline:
    name: "JS — quality baseline (limity scripts/**/*.js)"
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Kontrola proti .quality-baseline.json (selže jen při zhoršení)
        run: node scripts/quality/baseline.js --check

  # ETH-277 — zdravotni ukazatel repa (trend technickeho dluhu). `quality-baseline`
  # odpovi "je neco pres limit?", tenhle job "roste dluh, nebo klesa?". Meridlo je
  # zrcadlo z ethel-proxy (`scripts/quality/health*.py`) — meni se tam a kopiruje sem.
  code-health:
    name: "Zdravotní ukazatel repa (ETH-277)"
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # `baseline.js` meri JS pres ESLint, takze health check potrebuje zavislosti.
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Nejdriv meridlo, pak mereni: hlidka, ktera prestane umet chytit zhorseni,
      # sviti zelene stejne jako cisty repo (nalez ETH-342).
      - name: Selftest měřidla (musí umět spadnout)
        run: python scripts/quality/health.py --selftest
      - name: Kontrola proti .quality-health.json
        run: python scripts/quality/health.py --check
      - name: Dnešní bod do summary
        if: always()
        run: |
          {
            echo "### Zdravotní ukazatel (ETH-277)"
            echo '```json'
            python scripts/quality/health.py || echo "měřidlo neměří — viz krok výš"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ETH-277 — tydenni budik. `--trend` cte jen historii `.quality-health.json`
  # v gitu, takze nepotrebuje ani npm, ani meridlo limitu.
  code-health-trend:
    name: "Trend dluhu — týdenní budík (ETH-277)"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Melky checkout by ukazal jeden bod a tvaril se, ze dluh nikdy nerostl.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tabulka trendu do summary
        run: python scripts/quality/health.py --trend >> "$GITHUB_STEP_SUMMARY"
      - name: Budík (růst za 28 dní, přírůstek výjimek, blížící se expirace)
        run: python scripts/quality/health.py --trend --alarm --window-days 28
      - name: Nahlásit jako issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Trend technického dluhu — budík (ETH-277)";
            const label = "code-health";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Týdenní kontrola trendu se ozvala: ${runUrl}\n\n` +
              "Důvod je v logu kroku *Budík* (růst indexu za okno, přírůstek výjimek, " +
              "nebo výjimka propadající do 14 dní). Postup viz " +
              "`ethel-proxy/docs/refaktoring-rezim.md`.";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: label,
            });
            const already = existing.find((i) => i.title === title);
            if (already) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: already.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: [label],
              });
            }

  dependency-audit:
    name: "JS — npm audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Zjisti, jestli se změnil package-lock.json
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            if [ -z "$BASE" ]; then BASE="${{ github.event.before }}"; fi
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            elif git diff --name-only "$BASE" "${{ github.sha }}" -- package-lock.json | grep -q .; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: "22"
      - name: npm audit (neblokující, viz docs/eth270-ci-konvence.md)
        if: steps.changed.outputs.run == 'true'
        continue-on-error: true
        run: |
          npm ci
          {
            echo "### npm audit"
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Přeskočeno — package-lock.json se nezměnil
        if: steps.changed.outputs.run != 'true'
        run: echo "::notice::npm audit přeskočen, package-lock.json se v tomto běhu nezměnil. Ruční běh - workflow_dispatch. Týdenní schedule (pondělí 06:00 UTC) je otevřený bod, rozběhne se až po mergi do main."
