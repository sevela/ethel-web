<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>OG image – ethel.cz</title>
<!-- Načítá se přes lokální server ze scripts/generate-og.js, ne přes file://,
     aby fungovaly absolutní cesty k fontům a tokenům. -->
<link rel="stylesheet" href="/brand/fonts.css">
<link rel="stylesheet" href="/brand/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 76px 88px;
  }

  /* jantarové záře – stejný princip jako hero na webu */
  body::before {
    content: '';
    position: absolute;
    top: -240px; right: -200px;
    width: 760px; height: 760px;
    background: radial-gradient(circle, rgba(var(--accent-rgb), 0.20) 0%, rgba(var(--accent-rgb), 0) 66%);
  }
  body::after {
    content: '';
    position: absolute;
    bottom: -280px; left: -180px;
    width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(var(--accent-rgb), 0.10) 0%, rgba(var(--accent-rgb), 0) 66%);
  }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(var(--accent-rgb), 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--accent-rgb), 0.035) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  .container { position: relative; z-index: 1; }

  .wordmark {
    font-family: var(--font-wordmark);
    font-weight: 500;
    font-size: 34px;
    text-transform: lowercase;
    margin-bottom: 44px;
  }
  .wordmark .dot { color: var(--accent); font-weight: 700; font-size: 1.25em; line-height: 1; }

  h1 {
    font-family: var(--font-display);
    font-weight: var(--weight-display);
    font-size: 64px; /* delší headline – 78px by přeteklo šířku 1200 */
    line-height: 1.24;
  }
  h1 em { font-style: italic; color: var(--accent-l); }

  .label {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 20px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-l);
    padding: 8px 18px;
    border: 1px solid var(--accent-border);
    background: var(--accent-tint);
    border-radius: 8px;
    margin-bottom: 30px;
  }

  .footer-row {
    position: absolute;
    bottom: 76px; left: 88px; right: 88px;
    z-index: 1;
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 22px;
    color: var(--accent-l);
  }
  .rule { flex: 1; height: 1px; background: var(--border-2); margin-left: 28px; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="container">
    <div class="wordmark">ethel<span class="dot">.</span></div>
    <div class="label">AI asistentka pro Helios Inuvio</div>
    <h1>Rozumí vašemu Heliosu<br>a umí v&nbsp;něm pracovat</h1>
  </div>

  <div class="footer-row">
    <span>ethel.cz</span>
    <span class="rule"></span>
  </div>
</body>
</html>
